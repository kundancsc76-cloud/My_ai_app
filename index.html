<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .header {
      background: #111;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }

    textarea {
      width: 100%;
      height: 130px;
      padding: 15px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 17px;
    }

    .tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    .tool {
      padding: 18px;
      background: white;
      border-radius: 12px;
      text-align: center;
      border: 1px solid #ddd;
    }
  </style>
</head>

<body>

  <div class="header">
    🤖 My AI
  </div>

  <div class="container">

    <h2>What can I help with?</h2>

    <textarea id="prompt"
      placeholder="Apna question ya kaam yahan likho..."></textarea>

    <button onclick="askAI()">
      ✨ Ask AI
    </button>

    <div class="tools">
      <div class="tool">💬 AI Chat</div>
      <div class="tool">🖼️ Image</div>
      <div class="tool">🎬 Video</div>
      <div class="tool">🎤 Voice</div>
      <div class="tool">📄 PDF</div>
      <div class="tool">💻 Coding</div>
    </div>

    <div id="result"></div>

  </div>

  <script>
    function askAI() {
      const prompt = document.getElementById("prompt").value;

      if (!prompt.trim()) {
        document.getElementById("result").innerHTML =
          "<p>Please enter something first.</p>";
        return;
      }

      document.getElementById("result").innerHTML =
        "<p>🤖 AI response yahan aayega...</p>";
    }
  </script>

</body>
</html>
