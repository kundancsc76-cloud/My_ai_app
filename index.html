    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .header {
      background: #111;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }

    textarea {
      width: 100%;
      height: 130px;
      padding: 15px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 17px;
    }

    button:disabled {
      opacity: 0.6;
    }

    .tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    .tool {
      padding: 18px;
      background: white;
      border-radius: 12px;
      text-align: center;
      border: 1px solid #ddd;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 12px;
      border: 1px solid #ddd;
      white-space: pre-wrap;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="header">
    🤖 My AI
  </div>

  <div class="container">

    <h2>What can I help with?</h2>

    <textarea
      id="prompt"
      placeholder="Apna question ya kaam yahan likho..."
    ></textarea>

    <button id="askButton" onclick="askAI()">
      ✨ Ask AI
    </button>

    <div class="tools">
      <div class="tool">💬 AI Chat</div>
      <div class="tool">🖼️ Image</div>
      <div class="tool">🎬 Video</div>
      <div class="tool">🎤 Voice</div>
      <div class="tool">📄 PDF</div>
      <div class="tool">💻 Coding</div>
    </div>

    <div id="result">
      AI ka response yahan aayega...
    </div>

  </div>

  <script>
    async function askAI() {
      const prompt = document.getElementById("prompt").value.trim();
      const result = document.getElementById("result");
      const button = document.getElementById("askButton");

      if (!prompt) {
        result.textContent = "Please pehle apna question likho.";
        return;
      }

      button.disabled = true;
      button.textContent = "⏳ AI soch raha hai...";
      result.textContent = "🤖 AI response generate ho raha hai...";

      try {
        const response = await fetch("https://my-ai-app.kundancsc76.workers.dev/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            prompt: prompt
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "AI request failed");
        }

        result.textContent = data.answer || "AI ne koi response nahi diya.";

      } catch (error) {
        result.textContent =
          "❌ Error: " + error.message;
      }

      button.disabled = false;
      button.textContent = "✨ Ask AI";
    }
  </script>

</body>
</html>
